# Local Postgres for development. Production uses the Railway Postgres plugin.
services:
  db:
    image: postgres:16-alpine
    container_name: atheneum-pg
    environment:
      POSTGRES_PASSWORD: devlocal
      POSTGRES_DB: atheneum
    ports:
      - "55432:5432"
    volumes:
      - atheneum-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d atheneum"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  atheneum-pgdata:
